[project]
name = "extracted-features-notebooks"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "bertopic>=0.16.0",
    "gensim>=4.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8.0",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyldavis>=3.4.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "wordcloud>=1.9.0",
]

[project.optional-dependencies]
nlp = [
    "booknlp>=1.0.7",
    "spacy>=3.7.0",
]
embeddings = [
    "nomic>=3.0.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.1.0",
    "transformers>=4.36.0",
]
ocr = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]
